[project]
name = "redes-neurais-eurosat"
version = "0.1.0"
description = "Trabalho de Redes Neurais: EuroSAT RGB — MLP x CNN x Transfer Learning em CPU"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "tabulate>=0.10.0",
    "tensorflow>=2.16",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
]
